
<!DOCTYPE html>
<html>
<head>
    <title>Bati na ba?</title>

    <!-- CSS: Website design -->
    <style>
        body {
            background-color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: black;
        }

        p {
            color: #black;
            font-size: 18px;
        }

        button {
            background-color: green;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- HTML: Website content -->
    <h1>Bati na ba?</h1>

    <p id="message">Let's see, let's see</p>

    <button onclick="changeStyle()">
        Click Me
    </button>

    <!-- JavaScript: Website functionality -->
    <script>
        function changeStyle() {
            document.getElementById("message").textContent =
                "ayoko, BLEHHHH";

            document.getElementById("message").style.color = "red";

            document.getElementById("message").style.fontSize = "24px";
        }
    </script>

</body>
</html>
